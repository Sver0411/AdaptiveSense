# =============================================================
# AdaptiveSense — Central Experiment Configuration
# All experiment parameters live here. Do NOT hardcode tuning
# values in code. Modify this file to change behaviour.
# =============================================================

dataset:
  # Reference sampling rate of the ground-truth datasets (Hz).
  ground_truth_rate_hz: 1.0
  raw_dir: dataset/raw
  # Column used as the time axis. Must be monotonically increasing.
  time_col: timestamp

sampling:
  min_interval: 5          # seconds
  default_interval: 20     # seconds
  max_interval: 60         # seconds

# Fixed-rate baseline strategies evaluated by the replay simulator.
# Each entry defines one fixed sampling (== upload) interval in seconds.
fixed_strategies:
  - 5
  - 10
  - 20
  - 40
  - 60

# -------------------------------------------------------------
# AdaptiveSense scheduler configuration
# -------------------------------------------------------------
adaptive:
  # Instability score = max over channels of the normalized change.
  # A per-channel change signal is normalized by that channel's
  # noise floor (typical minute-to-minute noise amplitude) so that
  # temperature, humidity and pressure can be compared on one scale.
  channels:
    temperature:
      noise_floor: 0.15        # °C
      use: true
    humidity:
      noise_floor: 0.8         # %RH
      use: true
    pressure:
      noise_floor: 0.3         # hPa
      use: false
    light:
      noise_floor: 30.0        # lux
      use: true

  analyzer:
    # Windows expressed in seconds of ground-truth time.
    variety_window_s: 30       # rolling std window (variance / std change)
    roc_window_s: 10           # rolling mean of |abs delta| (rate of change)
    baseline_tau_s: 60         # EMA time constant for the change baseline

  # State machine thresholds measured in units of "multiples of the
  # noise floor". Hysteresis is applied RELATIVELY.
  stable_threshold: 3.0        # score above this leaves STABLE
  active_threshold: 8.0        # score above this enters ALERT
  hysteresis_fraction: 0.5     # relative hysteresis band on each boundary

  # Interval ladder (seconds) per state. The scheduler moves along the
  # ladder as the state persists.
  ladders:
    stable: [20, 40, 60]
    active: [60, 30, 15, 5]
    alert: [5]

  # Event detection (used both for detected events and, at full
  # resolution, for the ground-truth event mask over the raw dataset).
  # An event on a channel is declared when the normalized score
  # stays above event_threshold for >= event_min_duration_s.
  event_threshold: 8.0
  event_min_duration_s: 10.0

  # Upload policy (which samples are transmitted to the server).
  upload:
    on_event: true
    on_state_change: true
    on_interval_change: true
    heartbeat_s: 60            # guaranteed periodic report (== 1 x max_interval)
    delta_threshold: 2.0       # report if normalized change vs last upload exceeds this

  # Energy proxy constants (bytes / estimated transmit energy).
  # These are ESTIMATED / PROXY values, never presented as real power.
  energy:
    payload_bytes_per_upload: 96
    energy_per_upload_mj: 1.0   # proxy figure, see docs/methodology.md

  # Seed for the replay simulator's tie-breaking / noise, kept for
  # reproducible experiments.
  random_seed: 42

results:
  output_dir: results
  # Supported chart formats; matplotlib file extension.
  plot_format: png
name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests, analysis and reproducibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The parity and BME280 tests compile the on-device C sources for the host,
      # so a C compiler and the maths library must be present. build-essential is
      # already on the runner image; this makes the requirement explicit.
      - name: Ensure a host C compiler is available
        run: |
          cc --version
          python -c "import shutil,sys; sys.exit(0 if shutil.which('cc') else 1)"

      # The generator is seeded and the labels are written from the generator's
      # own noise-free driven signal, so the datasets must regenerate byte for
      # byte. `git diff --exit-code` after the analysis step is what turns that
      # claim into a check.
      - name: Regenerate the synthetic datasets
        run: python dataset/generate_dataset.py

      - name: Configuration parity (YAML <-> firmware config.h)
        run: python scripts/check_config_parity.py

      - name: Unit tests
        run: python -m pytest tests/ -v

      - name: Run the analysis pipeline
        run: python analysis/analyze.py

      - name: Results must be reproducible
        run: |
          set -o pipefail

          # The reproducibility guarantee covers the NUMERIC artefacts: the
          # measured dataset, the ground-truth labels and every metrics/sample
          # CSV. Regenerating them must not change a single byte.
          if ! git diff --exit-code -- 'dataset/**/*.csv' 'results/**/*.csv'; then
            echo "::error::Regenerating the datasets or rerunning the analysis changed numeric results."
            echo "::error::The committed CSVs must be exactly what the pipeline produces."
            echo "----- changed numeric files -----"
            git diff --name-only -- 'dataset/**/*.csv' 'results/**/*.csv'
            exit 1
          fi
          echo "numeric artefacts: byte-identical after regeneration"

          # Figures are a different matter and they are checked differently on
          # purpose. The byte content of a PNG depends on the matplotlib,
          # freetype and harfbuzz builds, not on the experiment, so requiring
          # byte-identity would pin the plotting library instead of the science.
          # What must hold is that the pipeline still renders every figure.
          echo "----- regenerated figures -----"
          for f in results/plots/*.png; do
            size=$(stat -c %s "$f")
            echo "  $(basename "$f"): ${size} bytes"
            if [ "$size" -lt 10000 ]; then
              echo "::error::$f is suspiciously small; the plot did not render"
              exit 1
            fi
          done
          expected=5
          actual=$(ls -1 results/plots/*.png | wc -l)
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::expected $expected figures, found $actual"
            exit 1
          fi

          # Anything else that moved is a genuine reproducibility problem.
          if ! git diff --exit-code -- . ':(exclude)dataset/**/*.csv' ':(exclude)results/**/*.csv' ':(exclude)results/plots/*.png'; then
            echo "::error::The pipeline changed tracked files outside the expected outputs."
            git diff --name-only -- . ':(exclude)dataset/**/*.csv' ':(exclude)results/**/*.csv' ':(exclude)results/plots/*.png'
            exit 1
          fi
          echo "all reproducibility checks passed"

      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: |
            results/metrics_all.csv
            results/metrics_summary.csv
            results/plots/
          if-no-files-found: warn
